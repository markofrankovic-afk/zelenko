<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1613" media="(prefers-color-scheme: dark)">
<title>Zelenko – Gorski kotar offline vodič</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Dizajn sustav (UI/UX Pro Max): Flat stil · Barlow Condensed + Barlow · priroda zelena + sunčano jantarna.
   Bez sjena i prijelaza boja: visok kontrast za čitanje na suncu. Tamni način za sumrak i noć. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --muted-bg:#F1F6F2; --ink:#14201A; --ink2:#34433A; --muted:#5A6A60;
  --line:#E2ECE4; --line2:#CFDDD2;
  --accent:#15803D; --on-accent:#FFFFFF; --accent-fill:#15803D; --on-accent-fill:#FFFFFF; --accent-soft:#E7F5EB; --accent-ink:#14532D;
  --heading:#15803D; --strong:#1A4129; --on-strong:#FFFFFF;
  --hero:#1A4129; --on-hero:#F3F8F4; --hero-muted:#A9D8B6; --hero-accent:#86CF9B; --on-hero-accent:#10291A;
  --secondary:#0F766E; --amber:#C2700A; --on-amber:#FFFFFF; --amber-soft:#FBEFD9; --amber-ink:#6B3A05;
  --sos:#C62828; --on-sos:#FFFFFF; --ok:#15803D; --warn:#A15C07;
  --map:#EAF0E6; --map-road-a:#E39B3B; --map-road-b:#EFC77A; --map-road:#FFFFFF; --map-road-casing:#B3BFB0; --map-track:#A68A62; --map-path:#8A6B43;
  --map-water:#B4D8EF; --map-river:#5B9FD3; --map-town:#EFEAE0; --map-hps:#C62828; --map-np:#2F7D4F; --map-rail:#7A8580; --map-label:#1F2A24;
  --marker-stroke:#FFFFFF; --scrim:rgba(20,32,26,.5);
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --dur:160ms; --ease:cubic-bezier(.2,.7,.3,1);
  --tab-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#18221D; --muted-bg:#1E2A24; --ink:#E6EDE8; --ink2:#C2CEC6; --muted:#97A79D;
  --line:#26332C; --line2:#37473E;
  --accent:#7CC895; --on-accent:#0F1613; --accent-fill:#2E6B45; --on-accent-fill:#F1F8F3; --accent-soft:#1F3428; --accent-ink:#B6E2C3;
  --heading:#86CF9B; --strong:#E6EDE8; --on-strong:#0F1613;
  --hero:#1C3326; --on-hero:#ECF4EE; --hero-muted:#9DB8A6; --hero-accent:#7CC895; --on-hero-accent:#0F1613;
  --secondary:#5EC3B5; --amber:#D9A04A; --on-amber:#1A1206; --amber-soft:#33281A; --amber-ink:#EBC98F;
  --sos:#C62828; --on-sos:#FFFFFF; --ok:#7CC895; --warn:#D9A04A;
  --map:#131B17; --map-road-a:#A97D45; --map-road-b:#7E6D4E; --map-road:#4A5951; --map-road-casing:#202A25; --map-track:#625543; --map-path:#7A6548;
  --map-water:#1B3344; --map-river:#3D78A0; --map-town:#1C2621; --map-hps:#D97566; --map-np:#5FA77A; --map-rail:#5E6B65; --map-label:#D9E3DC;
  --marker-stroke:#0F1613; --scrim:rgba(0,0,0,.6);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18221D; --muted-bg:#1E2A24; --ink:#E6EDE8; --ink2:#C2CEC6; --muted:#97A79D;
  --line:#26332C; --line2:#37473E;
  --accent:#7CC895; --on-accent:#0F1613; --accent-fill:#2E6B45; --on-accent-fill:#F1F8F3; --accent-soft:#1F3428; --accent-ink:#B6E2C3;
  --heading:#86CF9B; --strong:#E6EDE8; --on-strong:#0F1613;
  --hero:#1C3326; --on-hero:#ECF4EE; --hero-muted:#9DB8A6; --hero-accent:#7CC895; --on-hero-accent:#0F1613;
  --secondary:#5EC3B5; --amber:#D9A04A; --on-amber:#1A1206; --amber-soft:#33281A; --amber-ink:#EBC98F;
  --sos:#C62828; --on-sos:#FFFFFF; --ok:#7CC895; --warn:#D9A04A;
  --map:#131B17; --map-road-a:#A97D45; --map-road-b:#7E6D4E; --map-road:#4A5951; --map-road-casing:#202A25; --map-track:#625543; --map-path:#7A6548;
  --map-water:#1B3344; --map-river:#3D78A0; --map-town:#1C2621; --map-hps:#D97566; --map-np:#5FA77A; --map-rail:#5E6B65; --map-label:#D9E3DC;
  --marker-stroke:#0F1613; --scrim:rgba(0,0,0,.6);
  color-scheme:dark }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .osm-tiles{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.85) saturate(.6)}}
:root[data-theme="dark"] .osm-tiles{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.85) saturate(.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
html.big body{font-size:19px}
button,input,select{font:inherit;color:inherit}
button,a,summary,label[for]{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;line-height:1.08;text-wrap:balance;letter-spacing:.005em}
h1{font-size:2.25em} h2{font-size:1.5em} h3{font-size:1.2em}
/* naslovi sekcija u zelenoj, glavni naslov tamni: čisto, kao jedan brend */
.view h2,.sheet-body h3{color:var(--heading)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875em}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* pritisak: kratka povratna informacija, bez pomicanja okolnog sadržaja */
.btn,.chip,.fab,.tabs button,.list-row,.idea,.sos,.call,.sheet-close{transition:transform var(--dur) var(--ease),background-color var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.btn:active,.chip:active,.fab:active,.tabs button:active,.list-row:active,.idea:active,.sos:active,.call:active,.sheet-close:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.btn:active,.chip:active,.fab:active,.list-row:active,.idea:active,.sos:active,.call:active{transform:none}}

/* raspored */
.view{position:fixed;left:0;right:0;top:0;bottom:calc(var(--tab-h) + var(--safe-b));overflow:hidden}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + var(--safe-t)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.stack{display:flex;flex-direction:column;gap:var(--sp-4);max-width:640px;margin:0 auto}
.stack .stack,.card.stack{max-width:none;margin:0;width:100%}
.row{display:flex;gap:var(--sp-2);align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2)}
.eyebrow{font:600 12px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--safe-b));padding:0 env(safe-area-inset-right) var(--safe-b) env(safe-area-inset-left);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:900}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600;min-height:48px;position:relative}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .ic{width:22px;height:22px}

.sos{flex:none;min-width:48px;height:48px;padding:0 10px;border-radius:var(--r-sm);background:var(--sos);color:var(--on-sos);border:0;font:700 16px var(--f-disp);letter-spacing:.04em;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn{min-height:48px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent-fill)}
.btn.cta{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn.dark{background:var(--strong);border-color:var(--strong);color:var(--on-strong)}
.btn.danger{background:var(--sos);border-color:var(--sos);color:var(--on-sos)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-4)}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent-fill)}
.chip.soft[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent-fill)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.badge{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap}
.badge.free{background:var(--accent-soft);color:var(--accent-ink)}
.badge.pro{background:var(--amber-soft);color:var(--amber-ink)}
.list-row{display:flex;align-items:center;gap:var(--sp-3);min-height:56px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;padding:8px 0;color:var(--ink)}
.list-row .t{flex:1;display:flex;flex-direction:column;min-width:0}
.list-row .t b{font-weight:600;overflow-wrap:anywhere}
.list-row .t span{font-size:.875em;color:var(--muted)}
.card.list-row{border:1px solid var(--line);padding:12px 14px;margin:0}
/* istaknuta kartica (prijedlozi ruta): tamnozelena podloga, svjetlozeleni detalji */
.card.feat{background:var(--hero);border-color:var(--hero);color:var(--on-hero)}
.card.feat .meta{color:var(--hero-muted)!important}
.card.feat .badge.free{background:var(--hero-accent);color:var(--on-hero-accent)}
.card.feat .go{color:var(--hero-accent);font-weight:700;font-size:.9em;display:flex;align-items:center;gap:4px}
.card.feat .go .ic{width:16px;height:16px}
.note{border-radius:var(--r-sm);padding:12px 14px;font-size:.95em;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--amber-soft);color:var(--amber-ink)}
.note.ok{background:var(--accent-soft);color:var(--accent-ink)}
.icon-circle{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}

/* karta */
#map{position:absolute;inset:0;background:var(--map)}
.map-top{position:absolute;left:0;right:0;top:0;z-index:500;padding:calc(12px + var(--safe-t)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:var(--sp-2);pointer-events:none}
.map-top>*{pointer-events:auto}
.search{flex:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);color:var(--muted)}
.search input{border:0;outline:0;width:100%;background:transparent;font-size:16px;font-weight:500;color:var(--ink)}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:var(--sp-2);overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.status{align-self:flex-start;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink2)}
.route-pill{align-self:flex-start;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px 0 12px;border-radius:22px;background:var(--amber);color:var(--on-amber);font-weight:600;font-size:14px;border:0}
.route-pill .ic{width:18px;height:18px}
.search-pill{background:var(--accent-fill);color:var(--on-accent-fill)}
.results{background:var(--surface);border:1.5px solid var(--line2);border-radius:var(--r-sm);max-height:50vh;overflow-y:auto;padding:0 12px}
.fab-col{position:absolute;right:max(12px,env(safe-area-inset-right));z-index:500;display:flex;flex-direction:column;gap:var(--sp-2);bottom:calc(var(--near-h,220px) + 12px)}
.fab{width:48px;height:48px;border-radius:24px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.near{position:absolute;left:0;right:0;bottom:0;z-index:500;background:var(--surface);border-top:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:8px max(16px,env(safe-area-inset-right)) 4px max(16px,env(safe-area-inset-left))}
.near .grab{display:block;margin:0 auto 6px;width:40px;height:4px;border-radius:2px;background:var(--line2)}
.near-list{max-height:168px;overflow-y:auto}
.leaflet-container{font-family:var(--f-body);background:var(--map)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.lbl{font:700 14px var(--f-disp);color:var(--map-label);text-shadow:0 0 3px var(--map),0 0 3px var(--map),0 0 3px var(--map);white-space:nowrap;background:none;border:0;box-shadow:none;padding:0}
.lbl.sm{font:600 12px var(--f-body)}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-tooltip{font-family:var(--f-body);font-weight:600;border-radius:8px}
.num-icon{background:var(--ink);color:var(--bg);border-radius:50%;display:flex!important;align-items:center;justify-content:center;font:700 13px var(--f-disp);border:2px solid var(--surface)}
.car-icon{background:var(--amber);color:var(--on-amber);border-radius:8px;display:flex!important;align-items:center;justify-content:center;border:2px solid var(--surface)}

/* donji list */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:1000}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;z-index:1001;background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;flex-direction:column;border-top:1px solid var(--line);max-width:720px;margin:0 auto}
.sheet-bar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px 16px}
.sheet-bar .eyebrow{flex:1}
.sheet-close{width:48px;height:48px;border-radius:24px;border:1.5px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.sheet-body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right)) calc(24px + var(--safe-b)) max(16px,env(safe-area-inset-left))}
.hero{height:148px;border-radius:var(--r-md);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero span{position:relative;font-size:12px;font-weight:600;color:#fff;background:rgba(15,23,42,.55);padding:3px 8px;border-radius:8px}
.hero.foto{margin:0;height:auto;aspect-ratio:3/2;max-height:260px;background:var(--muted-bg);padding:0;flex-direction:column;align-items:stretch}
.hero.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--muted-bg)}
.hero.foto figcaption{display:none;position:relative;margin-top:auto;font-size:11.5px;line-height:1.35;color:#fff;background:linear-gradient(transparent,rgba(10,20,14,.72));padding:18px 10px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero.foto figcaption a{color:#fff;text-decoration:none}
.hero.foto.ok figcaption{display:block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2)}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:var(--sp-2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 4px;text-align:center}
.stats b{display:block;font:500 1.05em var(--f-mono)}
.stats span{font-size:12px;color:var(--muted)}
.mini-map{height:220px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
.num{width:28px;height:28px;flex:none;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font:700 14px var(--f-disp)}
.num.r{background:var(--sos);color:#fff}

/* vodi me */
.nav-dist{font:700 4.4em/1 var(--f-disp);text-align:center;font-variant-numeric:tabular-nums}
.compass{width:260px;height:260px;max-width:78vw;max-height:78vw;margin:4px auto;border-radius:50%;border:2px solid var(--line2);position:relative;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.compass .c{position:absolute;font:700 16px var(--f-disp);color:var(--muted)}
.compass svg{width:65%;height:65%;transition:transform .3s var(--ease)}

/* danas */
.wx{background:var(--hero);color:var(--on-hero);border-radius:var(--r-lg);padding:var(--sp-4);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3)}
.wx .eyebrow{color:var(--hero-muted)}
.wx b{display:block;font:700 2em/1.1 var(--f-disp)}
.wx .s{font-size:13px;color:var(--hero-muted)}
.wx .foot{grid-column:1/-1;font-size:12px;color:var(--hero-muted);border-top:1px solid color-mix(in srgb,var(--on-hero) 18%,transparent);padding-top:10px}
.ideas{display:flex;gap:var(--sp-3);overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.idea{flex:none;width:220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column;scroll-snap-align:start;color:var(--ink)}
.idea .top{height:96px;display:flex;align-items:flex-end;padding:8px 10px;background-size:cover!important;background-position:center!important}
.idea .top span{font-size:12px;font-weight:600;color:#fff;background:rgba(15,23,42,.5);padding:2px 8px;border-radius:8px}
.idea .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.idea .b span{font-size:.9em;color:var(--muted)}

/* sigurnost */
.call{min-height:80px;border-radius:var(--r-lg);background:var(--sos);color:var(--on-sos);display:flex;align-items:center;justify-content:center;gap:14px;text-decoration:none}
.call b{font:700 2.6em var(--f-disp)}
details.tip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
details.tip summary{font-weight:700;min-height:28px;display:flex;align-items:center;justify-content:space-between;list-style:none}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"+";font:700 20px var(--f-disp);color:var(--muted)}
details.tip[open] summary::after{content:"–"}
details.tip p{margin:8px 0 0;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.875em;font-weight:600;color:var(--ink2)}
.field select,.field input{min-height:48px;border:1.5px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);padding:0 12px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--muted-bg);border-radius:var(--r-sm);padding:4px}
.seg button{min-height:44px;border:0;border-radius:8px;background:none;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);outline:1.5px solid var(--line2)}
/* redovi podataka (specijaliteti) */
dl.info{margin:0}
.info-row{display:grid;grid-template-columns:108px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.info-row dt{font-weight:600;font-size:.9em;color:var(--ink2)}
.info-row dd{margin:0}
/* gastro */
.spec .top{align-items:flex-end}
.spec .top svg{opacity:.9}
.g-filter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.g-filter::-webkit-scrollbar{display:none}
/* radno vrijeme */
.rv{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.rv .dot{width:8px;height:8px;background:currentColor}
.rv.ok{color:var(--ok)} .rv.ne{color:var(--warn)} .rv.nep{color:var(--muted);font-weight:500}
/* informacije o mjestu */
.info-tab{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.info-red{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95em}
.info-red span{color:var(--ink2)} .info-red b{text-align:right;font-weight:600}
.info-rv{margin:0;padding-left:18px;font-size:.92em;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
.info-rv li:first-child{list-style:none;margin-left:-18px;font-weight:600;color:var(--ink)}
/* Zelenkova putovnica */
.prog{display:block;height:8px;border-radius:4px;background:var(--muted-bg);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pecat-box{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line2);border-radius:var(--r-md);padding:10px 12px}
.pecat-box.ok{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.pecat-box .t{flex:1;display:flex;flex-direction:column;min-width:0}
.pecat-box svg{flex:none}
.pecati{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.pecat{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px;color:var(--ink);text-align:center;font-size:.82em;font-weight:600;line-height:1.2;min-height:44px}
.pecat .krug{width:76px;height:76px;border-radius:50%;border:2.5px dashed var(--line2);display:flex;align-items:center;justify-content:center;background:var(--surface)}
.pecat .krug svg{filter:grayscale(1);opacity:.3}
.pecat.ok .krug{border:3px solid var(--accent);background:var(--accent-soft)}
.pecat.ok .krug svg{filter:none;opacity:1}
.pecat small{color:var(--muted);font-weight:500}
/* Zelenko (medo): oblačić sa savjetom */
.medo{display:flex;gap:10px;align-items:flex-end}
.medo>svg{flex:none}
.medo .bubble{flex:1;min-width:0;background:var(--accent-soft);border-radius:18px 18px 18px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.medo .bubble b{color:var(--accent-ink)}
.medo .bubble span{color:var(--ink2)}
.medo-go{align-self:flex-start;min-height:44px;margin:-4px 0 -10px;padding:0;border:0;background:none;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:4px;text-align:left}
.medo-go .ic{width:16px;height:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--safe-b) + 16px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:var(--r-sm);z-index:2000;font-weight:600}
</style>
</head>
<body>

<section class="view" id="v-karta" aria-label="Karta">
  <div id="map" role="application" aria-label="Karta Gorskog kotara"></div>
  <div class="map-top">
    <div class="row">
      <label class="search" for="q">
        <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search" data-ph="trazi_placeholder" data-t-aria="trazi_placeholder">
      </label>
      <button class="sos" data-go="sigurnost" data-t-aria="sos_aria" data-t="sos"></button>
    </div>
    <div class="results" id="results" hidden></div>
    <div class="chips" id="chips" role="toolbar" data-t-aria="filtri"></div>
    <button class="route-pill search-pill" id="searchPill" hidden></button>
    <button class="route-pill" id="routePill" hidden></button>
    <div class="status" id="netStatus"></div>
  </div>
  <div class="fab-col">
    <button class="fab" id="btnPopis" data-t-aria="popis"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    <button class="fab" id="btnAuto" data-t-aria="auto_naslov"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg></button>
    <button class="fab" id="btnLoc" data-t-aria="moja_lokacija"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12h3M19 12h3M12 2v3M12 19v3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="near" id="near"></div>
</section>

<section class="view" id="v-danas" aria-label="Danas" hidden><div class="scroll"><div class="stack" id="danas"></div></div></section>
<section class="view" id="v-rute" aria-label="Rute" hidden><div class="scroll"><div class="stack" id="rute"></div></div></section>
<section class="view" id="v-gastro" aria-label="Gastro" hidden><div class="scroll"><div class="stack" id="gastro"></div></div></section>
<section class="view" id="v-moje" aria-label="Moje" hidden><div class="scroll"><div class="stack" id="moje"></div></div></section>
<section class="view" id="v-sigurnost" aria-label="Sigurnost" hidden><div class="scroll"><div class="stack" id="sigurnost"></div></div></section>

<nav class="tabs" aria-label="Glavni izbornik">
  <button data-go="karta" aria-current="page"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="tab_karta"></span></button>
  <button data-go="danas"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-t="tab_danas"></span></button>
  <button data-go="gastro"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg><span data-t="tab_gastro"></span></button>
  <button data-go="rute"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg><span data-t="tab_rute"></span></button>
  <button data-go="moje"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-t="tab_moje"></span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
